[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/k90-supervisord.pid

[unix_http_server]
file=/tmp/k90-supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/k90-supervisor.sock

[program:backend]
command=python -m uvicorn webapp:app --host 0.0.0.0 --port 8000 --workers 1 --no-access-log
directory=/app
priority=10
autorestart=true
startsecs=3
startretries=5
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:telegram]
command=python telegram_adapter.py
directory=/app
priority=20
autorestart=unexpected
exitcodes=0
startsecs=0
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
