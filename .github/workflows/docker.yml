name: Build & Push Docker image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          # ARM64 disabled; uncomment this entry to restore native ARM tests.
          # - arch: arm64
          #   runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest -q

  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            tag_suffix: ''
          # ARM64 disabled; uncomment together with the ARM test entry above.
          # Separate tags prevent the ARM build from overwriting Intel's latest.
          # - arch: arm64
          #   runner: ubuntu-24.04-arm
          #   platform: linux/arm64
          #   tag_suffix: '-arm64'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: admroz/k90
          tags: |
            type=raw,value=latest${{ matrix.tag_suffix }}
            type=sha,prefix=sha-,suffix=${{ matrix.tag_suffix }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=k90-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=k90-${{ matrix.arch }}
