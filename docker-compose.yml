services:
  agent:
    image: ${AGENT_IMAGE:-admroz/k90:latest}
    container_name: k90-agent
    env_file:
      - .env
    environment:
      - WEB_PASSWORD=${WEB_PASSWORD:?Set WEB_PASSWORD to at least 12 characters}
      - TZ=${TZ:-${APP_TIMEZONE:-Europe/Warsaw}}
      - DB_PATH=/data/k90.db
      - DATA_DIR=/data
    volumes:
      - ${DATA_PATH:-./data}:/data
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-8000}:8000"
    restart: unless-stopped
